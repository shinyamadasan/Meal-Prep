name: Button tests

# Runs the Playwright button tests automatically. No AI/tokens involved — this is
# just GitHub's servers running `npm test`. Free for public repos.
on:
  push:
    branches: [main]
    # Only bother when something testable changed (skip pure docs pushes).
    paths:
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.js'  # decides which specs each gate runs
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  workflow_dispatch: {} # also lets you run it by hand from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Two gates, deliberately separate (D-065). The local suite loads index.html
      # from THIS checkout, so it validates the pushed code and needs no network; run
      # it FIRST so a real regression is reported in ~1 min instead of after a 90s
      # sleep and a network round-trip.
      - name: Run local suite (branch gate)
        run: npm run test:local

      # The production smokes hit the live GitHub Pages site, which redeploys ~1 min
      # after a push. Wait so we verify THIS push's deploy, not the previous one.
      - name: Wait for GitHub Pages to deploy
        run: sleep 90

      - name: Run production smokes (post-deploy gate)
        run: npm run test:prod

      # If anything fails, keep the HTML report so you can see what broke.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
