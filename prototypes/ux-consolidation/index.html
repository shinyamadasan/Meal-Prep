<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Meal Prep — UX Prototype</title>
<!--
  UX consolidation prototype (research only — not production code).
  Self-contained: no external requests. Sample data is generic and lives in memory;
  every change resets on reload. Visual tokens start from style.css :root; the text, badge
  and link tokens are darkened (light) / lightened (dark) to pass WCAG AA (see AUDIT.md §8).
-->
<style>
:root {
  --bg: #FAF7F2;
  --surface: #FFFFFF;
  --surface-2: rgba(94, 82, 64, 0.06);
  --text: rgb(28, 25, 23);
  --text-2: rgb(98, 91, 86);
  --primary: #7BAE7F;
  --primary-hover: rgb(100, 149, 104);
  --primary-strong: rgb(58, 94, 62);
  --on-primary: rgb(31, 33, 33);
  --primary-soft: rgba(123, 174, 127, 0.16);
  --border: rgba(94, 82, 64, 0.2);
  --card-border: rgba(94, 82, 64, 0.12);
  --warn: rgb(214, 118, 48);
  --warn-text: rgb(150, 70, 14);
  --warn-soft: rgba(244, 162, 97, 0.18);
  --danger: rgb(176, 18, 42);
  --danger-soft: rgba(192, 21, 47, 0.08);
  --badge-bg: rgb(150, 70, 14);
  --badge-fg: #FFFFFF;
  --badge2-bg: rgb(58, 94, 62);
  --badge2-fg: #FFFFFF;
  --toast-link: rgb(160, 210, 164);
  --focus: rgb(46, 92, 52);
  --sel-bg: rgb(58, 94, 62);
  --sel-fg: #FFFFFF;
  --control-border: rgb(133, 123, 111);
  --shadow: 0 1px 3px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.03);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.18);
  --r-sm: 6px; --r: 8px; --r-md: 10px; --r-lg: 12px; --r-full: 9999px;
  --font: "FKGroteskNeue", "Geist", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: rgb(40, 44, 52);
    --surface: rgb(55, 61, 72);
    --surface-2: rgba(255,255,255,0.06);
    --text: rgb(245, 245, 245);
    --text-2: rgb(204, 206, 208);
    --primary: rgb(163, 208, 167);
    --primary-hover: rgb(123, 174, 127);
    --primary-strong: rgb(171, 214, 175);
    --on-primary: rgb(31, 33, 33);
    --primary-soft: rgba(163, 208, 167, 0.16);
    --border: rgba(255,255,255,0.22);
    --card-border: rgba(255,255,255,0.1);
    --warn: rgb(244, 162, 97);
    --warn-text: rgb(250, 190, 140);
    --warn-soft: rgba(244, 162, 97, 0.16);
    --danger: rgb(255, 160, 164);
    --danger-soft: rgba(255, 84, 89, 0.14);
    --badge-bg: rgb(244, 162, 97);
    --badge-fg: rgb(31, 33, 33);
    --badge2-bg: rgb(163, 208, 167);
    --badge2-fg: rgb(31, 33, 33);
    --toast-link: rgb(46, 84, 50);
    --focus: rgb(171, 214, 175);
    --sel-bg: rgb(163, 208, 167);
    --sel-fg: rgb(31, 33, 33);
    --control-border: rgb(146, 152, 162);
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.45; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
::placeholder { color: var(--text-2); opacity: 1; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ── Shell ───────────────────────────────────────── */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--card-border); }
.top-in { max-width: 600px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 16px; }
.top h1 { font-size: 17px; margin: 0; flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.proto-tag { font-size: 11px; font-weight: 500; color: var(--text-2); border: 1px dashed var(--border); border-radius: var(--r-full); padding: 1px 8px; white-space: nowrap; }
.icon-btn { width: 44px; height: 44px; border-radius: var(--r-full); border: 0; background: transparent; display: grid; place-items: center; color: var(--text-2); flex: none; }
.icon-btn:hover { background: var(--surface-2); }
main { max-width: 600px; margin: 0 auto; padding: 12px 16px 104px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--card-border); padding-bottom: env(safe-area-inset-bottom); }
.nav-in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.nav button { border: 0; background: transparent; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 500; color: var(--text-2); position: relative; }
.nav button[aria-current="page"] { color: var(--primary-strong); font-weight: 600; }
.nav button[aria-current="page"] svg { stroke-width: 2.4; }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--primary-strong); }
.badge { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--r-full); background: var(--badge-bg); color: var(--badge-fg); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.badge.alt { background: var(--badge2-bg); color: var(--badge2-fg); }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 16px; height: 16px; }

/* ── Building blocks ─────────────────────────────── */
h2.page { font-size: 24px; margin: 4px 0 2px; }
.sub { color: var(--text-2); font-size: 14px; margin: 0 0 12px; }
.card { background: var(--surface); border: 1px solid var(--card-border); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 14px; margin: 12px 0; }
.card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-2); margin: 0 0 8px; display: flex; align-items: center; gap: 6px; min-height: 28px; }
.card h3 .more { margin-left: auto; text-transform: none; letter-spacing: 0; }
.row { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 0; border-top: 1px solid var(--card-border); }
.row:first-of-type { border-top: 0; }
.row-main { flex: 1; min-width: 0; min-height: 44px; text-align: left; background: none; border: 0; padding: 4px 0; }
.row-title { font-weight: 600; overflow-wrap: anywhere; }
.row-meta { font-size: 13px; color: var(--text-2); overflow-wrap: anywhere; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: var(--r); min-height: 44px; padding: 8px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { background: var(--primary-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--primary-strong); }
.btn.sm { min-height: 44px; padding: 4px 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn.danger { color: var(--danger); }
.btn[disabled] { color: var(--text-2); cursor: default; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 auto; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: var(--r-full); padding: 2px 9px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.chip.ok { background: var(--primary-soft); color: var(--primary-strong); }
.chip.warn { background: var(--warn-soft); color: var(--warn-text); }
.chip.bad { background: var(--danger-soft); color: var(--danger); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.seg button { flex: 0 1 auto; border: 1px solid var(--control-border); background: var(--surface); border-radius: var(--r-full); min-height: 44px; padding: 6px 14px; font-weight: 600; font-size: 14px; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--sel-bg); border-color: var(--sel-bg); color: var(--sel-fg); }
.seg.tight button { padding: 6px 11px; font-size: 13px; }
.seg button.is-empty { border-style: dashed; }
.seg button.is-empty[aria-pressed="true"] { border-style: solid; }
.seg .n { font-weight: 500; }
.filter-line { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0 0; }
.filter-label { font-size: 12px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 0; }
.search { position: relative; margin: 8px 0; }
.search input { width: 100%; min-height: 46px; border: 1px solid var(--control-border); border-radius: var(--r-md); background: var(--surface); padding: 10px 12px 10px 40px; font-size: 16px; }
.search svg { position: absolute; left: 12px; top: 15px; color: var(--text-2); }
input.field, select.field, textarea.field { width: 100%; min-height: 44px; border: 1px solid var(--control-border); border-radius: var(--r); background: var(--surface); padding: 8px 10px; font-size: 16px; }
label.lbl { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin: 10px 0 4px; }
.err { color: var(--danger); font-size: 13px; font-weight: 600; margin: 4px 0 0; }
.mode-intro { font-size: 14px; color: var(--text-2); margin: 4px 0 8px; }
.empty { text-align: center; color: var(--text-2); padding: 18px 8px; font-size: 14px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--control-border); border-radius: var(--r); flex: none; }
.stepper button { width: 44px; height: 44px; border: 0; background: none; font-size: 18px; font-weight: 600; }
.stepper span { min-width: 28px; text-align: center; font-weight: 600; }
.heart { width: 44px; height: 44px; border: 0; background: none; border-radius: var(--r-full); color: var(--text-2); display: grid; place-items: center; flex: none; }
.heart[aria-pressed="true"] { color: var(--danger); }
.heart[aria-pressed="true"] svg { fill: currentColor; }
.thumb { width: 40px; height: 40px; border-radius: var(--r); background: var(--primary-soft); color: var(--primary-strong); display: grid; place-items: center; font-weight: 700; flex: none; }
.thumb.sauce { background: var(--warn-soft); color: var(--warn-text); }
.alert { display: flex; align-items: center; gap: 10px; background: var(--warn-soft); border-radius: var(--r-lg); padding: 10px 12px; margin: 10px 0; border: 0; width: 100%; min-height: 52px; text-align: left; color: var(--text); }
.alert b { color: var(--warn-text); }
.quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.quick-grid .btn { flex-direction: column; min-height: 72px; white-space: normal; text-align: center; font-size: 13px; line-height: 1.2; padding: 8px 4px; }
.mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mode-card { border: 1px solid var(--card-border); background: var(--surface); border-radius: var(--r-lg); padding: 10px; text-align: left; min-height: 92px; display: flex; flex-direction: column; gap: 2px; }
.mode-card b { font-size: 14px; }
.mode-card span { font-size: 12px; color: var(--text-2); }
.group-h { font-size: 13px; font-weight: 700; color: var(--text-2); margin: 14px 0 2px; display: flex; gap: 6px; align-items: center; }
details.fold { border-top: 1px solid var(--card-border); }
details.fold > summary { list-style: none; min-height: 48px; display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "›"; margin-left: auto; transform: rotate(90deg); color: var(--text-2); font-size: 20px; }
details.fold[open] > summary::after { transform: rotate(-90deg); }
.check-btn { width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; flex: none; padding: 0; }
.check { width: 26px; height: 26px; border-radius: var(--r-sm); border: 2px solid var(--text-2); background: var(--surface); flex: none; display: grid; place-items: center; font-weight: 700; }
.check.on { background: var(--sel-bg); border-color: var(--sel-bg); color: var(--sel-fg); }
.lvl { border: 0; border-radius: var(--r-full); min-height: 44px; min-width: 60px; padding: 0 12px; font-size: 13px; font-weight: 700; flex: none; }
.lvl.ok { background: var(--primary-soft); color: var(--primary-strong); }
.lvl.warn { background: var(--warn-soft); color: var(--warn-text); }
.lvl.bad { background: var(--danger-soft); color: var(--danger); }
.steps { padding-left: 20px; margin: 4px 0 8px; }
.steps li { margin: 4px 0; }
.ing-list { list-style: none; padding: 0; margin: 4px 0 8px; }
.ing-list li { display: flex; gap: 8px; padding: 5px 0; border-top: 1px solid var(--card-border); }
.ing-list li:first-child { border-top: 0; }
.ing-list .have { color: var(--primary-strong); font-weight: 700; width: 18px; }
.ing-list .miss { color: var(--warn-text); font-weight: 700; width: 18px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.status-box { border-radius: var(--r-md); padding: 10px 12px; margin: 8px 0; font-size: 14px; }
.status-box.ok { background: var(--primary-soft); }
.status-box.warn { background: var(--warn-soft); }
.flow { display: flex; gap: 0; margin: 6px 0 4px; }
.flow div { flex: 1; text-align: center; font-size: 12px; color: var(--text-2); position: relative; padding-top: 30px; }
.flow div::before { content: attr(data-n); position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 24px; height: 24px; border-radius: var(--r-full); background: var(--surface-2); color: var(--text-2); font-weight: 700; display: grid; place-items: center; font-size: 12px; }
.flow div.done::before { background: var(--badge2-bg); color: var(--badge2-fg); content: "✓"; }
.flow div.now::before { background: var(--badge-bg); color: var(--badge-fg); }
.flow div.now { color: var(--text); font-weight: 600; }
.serv-line { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
.serv-line > span { flex: 1; font-weight: 600; }
.pick-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.pick-grid label { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 1px solid var(--control-border); border-radius: var(--r-full); font-size: 14px; font-weight: 600; }
.pick-grid input { width: 20px; height: 20px; margin: 0; }

/* ── Sheet + toast ───────────────────────────────── */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40; display: none; }
.scrim.open { display: block; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 600px; margin: 0 auto; background: var(--surface); border-radius: 16px 16px 0 0; box-shadow: var(--shadow-lg); max-height: 88vh; overflow-y: auto; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .2s ease; visibility: hidden; }
.sheet.open { transform: none; visibility: visible; }
.sheet-head { position: sticky; top: -8px; background: var(--surface); display: flex; align-items: center; gap: 8px; padding: 10px 0 8px; z-index: 1; }
.sheet-head h2 { font-size: 19px; margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--border); margin: 0 auto 2px; }
.sticky-actions { position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom)); background: var(--surface); padding: 10px 0 4px; display: flex; gap: 8px; }
.sticky-actions .btn { flex: 1; }
.toast { position: fixed; left: 16px; right: 16px; bottom: 76px; z-index: 60; max-width: 568px; margin: 0 auto; background: var(--text); color: var(--bg); border-radius: var(--r-md); padding: 6px 6px 6px 14px; min-height: 56px; display: flex; align-items: center; gap: 8px; font-size: 14px; box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(10px); transition: .18s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
.toast { --focus: var(--toast-link); } /* inverted surface: the ring uses the toast's own link colour */
.toast.show button { pointer-events: auto; }
.toast span { flex: 1; }
.toast button { border: 0; background: transparent; color: var(--toast-link); font-weight: 700; min-height: 44px; min-width: 64px; padding: 0 12px; border-radius: var(--r); }
.menu-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; border: 0; border-top: 1px solid var(--card-border); background: none; text-align: left; padding: 6px 2px; }
.menu-row:first-child { border-top: 0; }
.menu-row small { display: block; color: var(--text-2); font-size: 13px; }
.menu-row > div { flex: 1; min-width: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary-strong); display: inline-block; }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1><span id="page-title">Home</span> <span class="proto-tag">Prototype</span></h1>
    <button class="icon-btn" data-act="settings" aria-label="Settings, sync and backups">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<nav class="nav" aria-label="Main">
  <div class="nav-in">
    <button data-tab="home"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button data-tab="cook"><svg class="i" viewBox="0 0 24 24"><path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M2 10h20M9 6c0-1 1-1 1-2M14 6c0-1 1-1 1-2"/></svg>Cook</button>
    <button data-tab="kitchen"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M5 10h14M8 6v1M8 13v3"/></svg>Kitchen<span class="badge" id="kitchen-badge" hidden></span></button>
    <button data-tab="shop"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 8H6"/></svg>Shop<span class="badge alt" id="shop-badge" hidden></span></button>
  </div>
</nav>

<div class="scrim" id="scrim" data-act="close"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></section>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button id="toast-undo" hidden>Undo</button></div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════

const RECIPES = [

const starterCandidates = () => STARTER_FLAVORS.filter(f => !S.flavors.some(x => x.id === f.id) && !S.flavorDeleted.some(d => d.id === f.id));

  ${q || S.kfilter ? '' : `<div class="seg" role="group" aria-label="Kitchen sections">${segs.map(([k, l, n]) => `<button data-act="kseg" data-seg="${k}" aria-pressed="${S.kseg === k}">${l} <span class="n">${n}</span></button>`).join('')}</div>`}

const kindLabel = k => k === 'ready' ? 'Ready food' : k === 'prepped' ? 'Prepped' : 'Ingredient';

// deductIngredientsForRecipe(): one pass over the recipe's ingredient LINES, as the app does. Each line
// finds its lot and subtracts its scaled amount, so two lines that hit the same lot both deduct (the app
// has no per-lot "seen" set). Staples are never deducted; a lot is removed only when it reaches zero. A
// matched lot with no tracked amount (or a unit that doesn't convert) is skipped by the app; here it is
// listed unticked, and only an explicit "used it all up" tick removes it.
function cookPlan(r, factor) {
  const rows = [], left = new Map();
  r.ing.forEach(([n, q]) => {
    const lot = haveLot(n); if (!lot) return;
    const kind = S.prepped.includes(lot) ? 'prepped' : 'ing';
    if (lot.staple) { if (!rows.some(p => p.lot === lot)) rows.push({ lot, kind, mode: 'staple' }); return; }
    const have = left.has(lot.id) ? left.get(lot.id) : kind === 'prepped' ? lot.qty : lot.amt;
    const a = parseAmt(q);
    const use = a && have != null ? convert(a.v * factor, a.unit, lot.unit) : null;
    if (use == null) { rows.push({ lot, kind, mode: 'unknown', line: q }); return; }
    const rest = Math.max(0, +(have - use).toFixed(2));
    left.set(lot.id, rest);
    rows.push({ lot, kind, mode: rest <= 1e-6 ? 'all' : 'part', use, left: rest });
  });

}

// Apply the ticked rows, line by line, through set()/del() so one Undo restores every amount.

    const x = list.find(i => i.id === cb.value); if (!x || removed.has(x.id)) return;
    const rest = cb.dataset.mode === 'unknown' ? 0 : Math.max(0, +(x[key] - +cb.dataset.use).toFixed(2));

// stockPurchasedGroceryItem() (D-057): staple → Full; an exact-name, unexpired lot → merge (amounts sum
// only when both are known, otherwise unknown; its date is kept); else a new lot. Returns the receipt
// that unstockPurchasedGroceryItem() reverses exactly.
function stockBought(s) {
  const staple = S.ing.find(i => i.staple && nameMatch(i.name, s.name));
  if (staple) { const prev = staple.level; set(staple, 'level', 'Full'); return { mode: 'staple', id: staple.id, name: staple.name, prev }; }
  const same = S.ing.find(i => !i.staple && i.name.toLowerCase() === s.name.toLowerCase() && i.days >= 0);
  if (same) {
    const prev = same.amt, add = s.amt != null && same.amt != null ? convert(s.amt, s.unit, same.unit) : null;
    set(same, 'amt', add == null ? null : +(same.amt + add).toFixed(2));
    return { mode: 'merged', id: same.id, name: same.name, prev };
  }
  const lot = push(S.ing, { id: nid('i'), name: s.name, amt: s.amt ?? null, unit: s.unit || '', storage: CAT[s.name] === 'Pantry' ? 'Pantry' : 'Fridge', days: CAT[s.name] === 'Pantry' ? 180 : 5 });
  return { mode: 'created', id: lot.id, name: lot.name };
}
function unstockBought(rc) {
  const x = S.ing.find(i => i.id === rc.id); if (!x) return; // already removed by hand: nothing to undo
  if (rc.mode === 'created') removeById(S.ing, rc.id);
  else if (rc.mode === 'staple') x.level = rc.prev;
  else x.amt = rc.prev;
}

    syncPlanShop();
    const on = i < 0, c = el.querySelector('.check');
    el.setAttribute('aria-pressed', on); c.textContent = on ? '✓' : ''; c.classList.toggle('on', on);
    render();
  },
  'pick-low': () => { pick.low = !pick.low; pickerSheet(); },
  'pick-clear': () => { pick.q = ''; pickerSheet(); },
  'pick-view': d => recipeSheet(d.id, false, 'picker'),
  serv: d => { const b = S.plan.find(x => x.id === d.id); b.servings = Math.max(1, b.servings + +d.d); render(); },
  unplan: d => { tx(); const b = del(S.plan, d.id); syncPlanShop(); render(); done(recipe(b.rid).name + ' removed from meal prep'); },
  prepday: () => prepDaySheet(),
  'prep-step': (d, el) => {
    S.prepDone[d.k] = el.checked;
    const boxes = [...document.querySelectorAll('#sheet [data-act="prep-step"]')];
    $('prep-count').textContent = `${boxes.filter(b => b.checked).length} of ${boxes.length} steps done`;
  },
  'batch-done': d => batchDoneSheet(d.id),
  'save-batch': d => {
    const b = S.plan.find(x => x.id === d.id); if (!b) return; const r = recipe(b.rid);
    tx();
    const stock = applyTakeOut();
    push(S.ready, { id: nid('m'), name: r.name, portions: b.servings, storage: 'Fridge', days: r.fridge, protein: '' });
    del(S.plan, b.id); syncPlanShop();
    S.history.unshift({ id: nid('h'), rid: r.id, name: r.name, ago: 0, portions: b.servings });
    const h = S.history[0]; T.push(() => removeById(S.history, h.id));
    render(); if (S.plan.length) prepDaySheet(); else closeSheet();
    done(`${r.name}: ${b.servings} portions in Kitchen` + (stock ? ' · ' + stock : ''));
  },
  'made-sheet': d => madeSheet(d.kind, d.id),
  'save-made': d => {
    const qty = +$('mq').textContent; const where = $('mstore').value;
    const src = d.kind === 'sauce' ? flavor(d.id) : PREP_AHEADS.find(p => p.id === d.id);
    // No inferred expiry (D-074): days comes only from the optional use-by the user typed.
    const days = daysFromDate($('muse').value);
    tx();
    // One active batch per flavor (D-074): a new batch replaces the record in place, same id.
    const old = S.prepped.find(p => p.ref === d.id);
    if (old) { set(old, 'qty', qty); set(old, 'storage', where); set(old, 'days', days); set(old, 'kept', false); }
    else push(S.prepped, { id: nid('x'), type: d.kind, ref: d.id, name: src.name, qty, unit: d.kind === 'sauce' ? 'portions' : src.unit, storage: where, days });
    closeSheet(); render(); done(old ? `Replaced ${src.name} — ${amtText(qty, old.unit)}` : `${src.name} saved to Kitchen › ${KSEG.prepped}`);
  },
  bought: d => {
    const s = S.shop.find(x => x.id === d.id); if (!s) return;
    tx(); del(S.shop, s.id); const receipt = stockBought(s);
    push(S.bought, { id: nid('t'), row: s, receipt });
    render(); done(`${s.name} → Kitchen`);
  },
  // Untick from "Bought today": reverse exactly what the tick did, then put the row back on the list.
  unbuy: d => {
    const b = S.bought.find(x => x.id === d.id); if (!b) return;
    unstockBought(b.receipt); removeById(S.bought, b.id);
    if (!inShop(b.row.name)) S.shop.push(b.row);
    syncPlanShop(); render();
    const back = document.querySelector(`[data-act="bought"][aria-label="Bought ${CSS.escape(b.row.name)}"]`); if (back) back.focus({ preventScroll: true });
    toast(`${b.row.name} is back on your list`);
  },
  unshop: d => { tx(); del(S.shop, d.id); render(); done('Removed from list'); },
  restock: () => { tx(); S.ing.filter(i => i.staple && (i.level === 'Low' || i.level === 'Out')).forEach(i => addShop(i.name, 'low')); render(); done('Low staples added'); },
  'show-picks': () => { S.showPicks = true; render(); },
  'shop-menu': () => openSheet('List tools', `
    <button class="menu-row" data-act="stub" data-msg="Copy list to clipboard, unchanged"><div>Copy list</div></button>
    <button class="menu-row" data-act="stub" data-msg="Print list, unchanged"><div>Print</div></button>
    <button class="menu-row" data-act="stub" data-msg="Price list for these items + Price Book, unchanged"><div>Prices<small>Estimated cost and the Price Book</small></div></button>
    <button class="menu-row" data-act="clear-shop"><div>Clear the list</div></button>`),
  'clear-shop': () => { tx(); S.shop.slice().forEach(s => del(S.shop, s.id)); closeSheet(); render(); done('List cleared'); },
  'kitchen-menu': () => { const n = expired().length; openSheet('Kitchen tools', `
    <button class="menu-row" data-act="remove-expired"><div>Remove expired (${n})<small>${n ? esc(expired().map(x => x.name).join(', ')) : 'Nothing has expired'}</small></div></button>
    <button class="menu-row" data-act="stub" data-msg="Stock health report, unchanged"><div>Stock health report</div></button>
    <button class="menu-row" data-act="stub" data-msg="Inventory checked stamp, unchanged"><div>I checked everything<small>Mark today as a full inventory check</small></div></button>
    <button class="menu-row" data-act="stub" data-msg="Select mode + bulk actions, unchanged"><div>Select several</div></button>
    <button class="menu-row" data-act="stub" data-msg="Ingredient browser, unchanged"><div>Browse ingredients</div></button>`); }
};

document.addEventListener('click', e => {
  const nav = e.target.closest('.nav button');
  if (nav) { go(nav.dataset.tab); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  T = null;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') { A[el.dataset.act] && A[el.dataset.act](el.dataset, el); return; }
  e.preventDefault();
  const fn = A[el.dataset.act];
  if (fn) fn(el.dataset, el);
});
document.addEventListener('submit', e => {
  if (e.target.dataset.form === 'add-item') {
    e.preventDefault();
    const v = $('shop-add').value;
    tx(); if (addShop(v)) { render(); $('shop-add').value = ''; $('shop-add').focus(); done(v.trim() + ' added'); } else T = null;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'cook-q') { S.cq = e.target.value; render(); }
  if (e.target.id === 'kitchen-q') { S.kq = e.target.value; S.kfilter = ''; render(); }
  if (e.target.id === 'pick-q') { pick.q = e.target.value; $('pick-list').innerHTML = pickListHtml(); }
  if (e.target.id === 'out-q') {
    const q = e.target.value; let n = 0;
    const rows = [...document.querySelectorAll('#out-list .menu-row')];
    rows.forEach(b => { b._rank = matchRank(b.dataset.name, q); b.hidden = b._rank < 0; if (!b.hidden) n++; });
    rows.sort((a, b) => (a._rank < 0) - (b._rank < 0) || a._rank - b._rank || a.dataset.name.localeCompare(b.dataset.name)).forEach(b => $('out-list').appendChild(b));
    const none = $('out-none'); none.hidden = n > 0 || !q.trim();
    if (!none.hidden) none.innerHTML = `Not in your kitchen. <button class="btn sm" data-act="add-shop" data-name="${esc(q.trim())}">Add “${esc(q.trim())}” to Shop</button>`;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('sheet').classList.contains('open')) closeSheet(); });
syncPlanShop();
render();
</script>
</body>
</html>
