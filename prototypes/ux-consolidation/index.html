<html lang="en">

<title>Meal Prep — UX Prototype</title>
<!--
  UX consolidation prototype (research only — not production code).
  Self-contained: no external requests. Sample data is generic and lives in memory;
  every change resets on reload. Visual tokens copied from style.css :root.
-->
<style>
:root {
  --bg: #FAF7F2;
  --surface: #FFFFFF;
  --surface-2: rgba(94, 82, 64, 0.06);
  --text: rgb(28, 25, 23);
  --text-2: rgb(107, 100, 95);
  --primary: #7BAE7F;
  --primary-hover: rgb(100, 149, 104);
  --primary-strong: rgb(80, 120, 84);
  --on-primary: rgb(31, 33, 33);
  --primary-soft: rgba(123, 174, 127, 0.16);
  --border: rgba(94, 82, 64, 0.2);
  --card-border: rgba(94, 82, 64, 0.12);
  --warn: rgb(214, 118, 48);
  --warn-soft: rgba(244, 162, 97, 0.18);
  --danger: rgb(192, 21, 47);
  --danger-soft: rgba(192, 21, 47, 0.08);
  --focus: rgba(123, 174, 127, 0.45);
  --shadow: 0 1px 3px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.03);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.18);
  --r-sm: 6px; --r: 8px; --r-md: 10px; --r-lg: 12px; --r-full: 9999px;
  --font: "FKGroteskNeue", "Geist", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: rgb(40, 44, 52);
    --surface: rgb(55, 61, 72);
    --surface-2: rgba(255,255,255,0.06);
    --text: rgb(245, 245, 245);
    --text-2: rgba(167, 169, 169, 1);
    --primary: rgb(163, 208, 167);
    --primary-hover: rgb(123, 174, 127);
    --primary-strong: rgb(163, 208, 167);
    --on-primary: rgb(31, 33, 33);
    --primary-soft: rgba(163, 208, 167, 0.16);
    --border: rgba(255,255,255,0.16);
    --card-border: rgba(255,255,255,0.1);
    --warn: rgb(244, 162, 97);
    --warn-soft: rgba(244, 162, 97, 0.16);
    --danger: rgb(255, 120, 124);
    --danger-soft: rgba(255, 84, 89, 0.14);
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.45; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ── Shell ───────────────────────────────────────── */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--card-border); }
.top-in { max-width: 600px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 16px; }
.top h1 { font-size: 17px; margin: 0; flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.proto-tag { font-size: 11px; font-weight: 500; color: var(--text-2); border: 1px dashed var(--border); border-radius: var(--r-full); padding: 1px 8px; white-space: nowrap; }
.icon-btn { width: 44px; height: 44px; border-radius: var(--r-full); border: 0; background: transparent; display: grid; place-items: center; color: var(--text-2); }
.icon-btn:hover { background: var(--surface-2); }
main { max-width: 600px; margin: 0 auto; padding: 12px 16px 104px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--card-border); padding-bottom: env(safe-area-inset-bottom); }
.nav-in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.nav button { border: 0; background: transparent; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 500; color: var(--text-2); position: relative; }
.nav button[aria-current="page"] { color: var(--primary-strong); font-weight: 600; }
.nav button[aria-current="page"] svg { stroke-width: 2.4; }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--primary); }
.badge { position: absolute; top: 7px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--r-full); background: var(--warn); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 16px; height: 16px; }

/* ── Building blocks ─────────────────────────────── */
h2.page { font-size: 24px; margin: 4px 0 2px; }
.sub { color: var(--text-2); font-size: 14px; margin: 0 0 12px; }
.card { background: var(--surface); border: 1px solid var(--card-border); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 14px; margin: 12px 0; }
.card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-2); margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
.card h3 .more { margin-left: auto; text-transform: none; letter-spacing: 0; }
.row { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 0; border-top: 1px solid var(--card-border); }
.row:first-of-type { border-top: 0; }
.row-main { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 4px 0; }
.row-title { font-weight: 600; overflow-wrap: anywhere; }
.row-meta { font-size: 13px; color: var(--text-2); overflow-wrap: anywhere; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: var(--r); min-height: 44px; padding: 8px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { background: var(--primary-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--primary-strong); }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn.danger { color: var(--danger); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 auto; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: var(--r-full); padding: 2px 9px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.chip.ok { background: var(--primary-soft); color: var(--primary-strong); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--danger-soft); color: var(--danger); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 0 1 auto; border: 1px solid var(--border); background: var(--surface); border-radius: var(--r-full); min-height: 40px; padding: 6px 14px; font-weight: 600; font-size: 14px; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.seg .n { font-weight: 500; opacity: .75; }
.search { position: relative; margin: 8px 0; }
.search input { width: 100%; min-height: 46px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); padding: 10px 12px 10px 40px; font-size: 16px; }
.search svg { position: absolute; left: 12px; top: 13px; color: var(--text-2); }
input.field, select.field, textarea.field { width: 100%; min-height: 44px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); padding: 8px 10px; font-size: 16px; }
label.lbl { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin: 10px 0 4px; }
.mode-intro { font-size: 14px; color: var(--text-2); margin: 4px 0 8px; }
.empty { text-align: center; color: var(--text-2); padding: 18px 8px; font-size: 14px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: var(--r); }
.stepper button { width: 40px; height: 40px; border: 0; background: none; font-size: 18px; font-weight: 600; }
.stepper span { min-width: 28px; text-align: center; font-weight: 600; }
.heart { width: 40px; height: 40px; border: 0; background: none; border-radius: var(--r-full); color: var(--text-2); display: grid; place-items: center; flex: none; }
.heart[aria-pressed="true"] { color: var(--danger); }
.heart[aria-pressed="true"] svg { fill: currentColor; }
.thumb { width: 40px; height: 40px; border-radius: var(--r); background: var(--primary-soft); color: var(--primary-strong); display: grid; place-items: center; font-weight: 700; flex: none; }
.thumb.sauce { background: var(--warn-soft); color: var(--warn); }
.alert { display: flex; align-items: center; gap: 10px; background: var(--warn-soft); border-radius: var(--r-lg); padding: 10px 12px; margin: 10px 0; border: 0; width: 100%; text-align: left; color: var(--text); }
.alert b { color: var(--warn); }
.quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.quick-grid .btn { flex-direction: column; min-height: 72px; white-space: normal; text-align: center; font-size: 13px; line-height: 1.2; padding: 8px 4px; }
.mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mode-card { border: 1px solid var(--card-border); background: var(--surface); border-radius: var(--r-lg); padding: 10px; text-align: left; min-height: 92px; display: flex; flex-direction: column; gap: 2px; }
.mode-card b { font-size: 14px; }
.mode-card span { font-size: 12px; color: var(--text-2); }
.group-h { font-size: 13px; font-weight: 700; color: var(--text-2); margin: 14px 0 2px; display: flex; gap: 6px; align-items: center; }
details.fold { border-top: 1px solid var(--card-border); }
details.fold > summary { list-style: none; min-height: 48px; display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "›"; margin-left: auto; transform: rotate(90deg); color: var(--text-2); font-size: 20px; }
details.fold[open] > summary::after { transform: rotate(-90deg); }
.check { width: 26px; height: 26px; border-radius: var(--r-sm); border: 2px solid var(--border); background: var(--surface); flex: none; display: grid; place-items: center; }
.steps { padding-left: 20px; margin: 4px 0 8px; }
.steps li { margin: 4px 0; }
.ing-list { list-style: none; padding: 0; margin: 4px 0 8px; }
.ing-list li { display: flex; gap: 8px; padding: 5px 0; border-top: 1px solid var(--card-border); }
.ing-list li:first-child { border-top: 0; }
.ing-list .have { color: var(--primary-strong); font-weight: 700; width: 18px; }
.ing-list .miss { color: var(--warn); font-weight: 700; width: 18px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.status-box { border-radius: var(--r-md); padding: 10px 12px; margin: 8px 0; font-size: 14px; }
.status-box.ok { background: var(--primary-soft); }
.status-box.warn { background: var(--warn-soft); }
.flow { display: flex; gap: 0; margin: 6px 0 4px; }
.flow div { flex: 1; text-align: center; font-size: 12px; color: var(--text-2); position: relative; padding-top: 30px; }
.flow div::before { content: attr(data-n); position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 24px; height: 24px; border-radius: var(--r-full); background: var(--surface-2); color: var(--text-2); font-weight: 700; display: grid; place-items: center; font-size: 12px; }
.flow div.done::before { background: var(--primary); color: var(--on-primary); content: "✓"; }
.flow div.now::before { background: var(--warn); color: #fff; }
.flow div.now { color: var(--text); font-weight: 600; }

/* ── Sheet + toast ───────────────────────────────── */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40; display: none; }
.scrim.open { display: block; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 600px; margin: 0 auto; background: var(--surface); border-radius: 16px 16px 0 0; box-shadow: var(--shadow-lg); max-height: 88vh; overflow-y: auto; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .2s ease; visibility: hidden; }
.sheet.open { transform: none; visibility: visible; }
.sheet-head { position: sticky; top: -8px; background: var(--surface); display: flex; align-items: center; gap: 8px; padding: 10px 0 8px; z-index: 1; }
.sheet-head h2 { font-size: 19px; margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--border); margin: 0 auto 2px; }
.sticky-actions { position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom)); background: var(--surface); padding: 10px 0 4px; display: flex; gap: 8px; }
.sticky-actions .btn { flex: 1; }
.toast { position: fixed; left: 16px; right: 16px; bottom: 76px; z-index: 60; max-width: 568px; margin: 0 auto; background: var(--text); color: var(--bg); border-radius: var(--r-md); padding: 10px 12px 10px 14px; display: flex; align-items: center; gap: 8px; font-size: 14px; box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(10px); transition: .18s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
.toast.show button { pointer-events: auto; }
.toast span { flex: 1; }
.toast button { border: 0; background: transparent; color: var(--primary); font-weight: 700; min-height: 36px; padding: 0 8px; }
@media (prefers-color-scheme: dark) { .toast button { color: rgb(80,120,84); } }
.menu-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; border: 0; border-top: 1px solid var(--card-border); background: none; text-align: left; padding: 6px 2px; }
.menu-row:first-child { border-top: 0; }
.menu-row small { display: block; color: var(--text-2); font-size: 13px; }
.menu-row > div { flex: 1; min-width: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); display: inline-block; }
</style>
</head>

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const recipe = id => RECIPES.find(r => r.id === id);
const flavor = id => FLAVORS.find(f => f.id === id);
const words = s => s.toLowerCase().replace(/[^a-z ]/g, ' ').split(/\s+/).filter(Boolean).map(w => w.replace(/(es|s)$/, ''));
// Whole-word match so "Egg" never matches "Eggplant".
function nameMatch(a, b) {
  const A = words(a), B = words(b);
  const [short, long] = A.length <= B.length ? [A, B] : [B, A];
  return short.length > 0 && short.every(w => long.includes(w));
}
function haveLot(name) {
  const lot = S.ing.find(i => nameMatch(i.name, name) && (i.staple ? i.level !== 'Out' : i.days >= 0));
  if (lot) return lot;
  return S.prepped.find(p => p.name.toLowerCase() === name.toLowerCase() || (p.type === 'sauce' && nameMatch(p.name + ' sauce', name)));
}
const missing = r => r.ing.map(x => x[0]).filter(n => !haveLot(n));
const inShop = name => S.shop.find(s => nameMatch(s.name, name));
function daysChip(d) {
  if (d == null) return '';
  if (d < 0) return '<span class="chip bad">Expired</span>';
  if (d === 0) return '<span class="chip warn">Today</span>';
  if (d <= 2) return `<span class="chip warn">${d}d left</span>`;
  if (d > 99) return '<span class="chip">Keeps</span>';
  return `<span class="chip">${d}d left</span>`;
}
const attention = () => [
  ...S.ing.filter(i => !i.staple && i.days <= 2).map(i => ({ ...i, kind: 'ing' })),

function syncPlanShop() {
  // Shop rows derived from the plan are recomputed; manual rows are kept.
  S.shop = S.shop.filter(s => s.src !== 'plan');
  const need = {};
  S.plan.forEach(b => { const r = recipe(b.rid); missing(r).forEach(n => { (need[n] = need[n] || []).push(r.name); }); });
  Object.keys(need).forEach(n => { if (!inShop(n)) S.shop.push({ id: nid('s'), name: n, src: 'plan', for: need[n] }); });
}
function planHave() {
  const set = new Set();
  S.plan.forEach(b => recipe(b.rid).ing.forEach(x => { if (haveLot(x[0])) set.add(x[0]); }));
  return [...set];
}

let undoSnap = null, toastTimer = null;
function snapshot() { undoSnap = JSON.stringify(S); }
function toast(msg, undoable) {
  $('toast-msg').textContent = msg;
  $('toast-undo').hidden = !undoable;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4500);
}
$('toast-undo').addEventListener('click', () => {
  if (!undoSnap) return;
  const keep = { tab: S.tab, cook: S.cook, kseg: S.kseg };
  S = Object.assign(JSON.parse(undoSnap), keep); undoSnap = null;
  $('toast').classList.remove('show'); render();
});

    <div class="card">

        <div data-n="2" class="${step > 2 ? 'done' : step === 2 ? 'now' : ''}">Shop</div>

        <div data-n="4">Kitchen</div>

/* ════════════════════════════════════════════════════════════════
   KITCHEN — ready food · prepped · ingredients
   ════════════════════════════════════════════════════════════════ */
function renderKitchen() {
  const att = attention();
  const q = S.kq.trim().toLowerCase();
  const segs = [['ready', 'Ready', S.ready.length], ['prepped', 'Prepped', S.prepped.length], ['ing', 'Ingredients', S.ing.length]];
  let body = '';
  const match = x => !q || x.name.toLowerCase().includes(q);
  if (S.kfilter === 'soon') {
    body = `<div class="card"><h3>Use soon or check <button class="btn ghost sm more" data-act="kfilter" data-v="">Show all</button></h3>
      ${att.map(a => `<div class="row"><button class="row-main" data-act="${a.kind === 'ready' ? 'ready-sheet' : 'item-sheet'}" data-kind="${a.kind}" data-id="${a.id}">
        <div class="row-title">${esc(a.name)}</div><div class="row-meta">${a.kind === 'ready' ? 'Ready food' : a.kind === 'prepped' ? 'Prepped' : 'Ingredient'} · ${esc(a.storage)}</div></button>
        ${daysChip(a.days)}
        ${a.days < 0 ? `<button class="btn sm" data-act="toss" data-kind="${a.kind}" data-id="${a.id}">Toss</button>` : `<button class="btn sm" data-act="keep" data-kind="${a.kind}" data-id="${a.id}">Still good</button>`}
      </div>`).join('') || '<div class="empty">Nothing needs attention.</div>'}</div>`;
  } else if (q) {
    const all = [...S.ready.map(m => ({ ...m, kind: 'ready' })), ...S.prepped.map(p => ({ ...p, kind: 'prepped' })), ...S.ing.map(i => ({ ...i, kind: 'ing' }))].filter(match);
    body = `<div class="card">${all.map(itemRow).join('') || `<div class="empty">No “${esc(S.kq)}” in your kitchen.<br><button class="btn sm" style="margin-top:8px" data-act="add-shop" data-name="${esc(S.kq)}">Add “${esc(S.kq)}” to Shop</button></div>`}</div>`;
  } else if (S.kseg === 'ready') {
    body = `<div class="card">${S.ready.slice().sort((a, b) => a.days - b.days).map(readyRow).join('') || '<div class="empty">No ready food. Cooked meals and leftovers show up here.</div>'}</div>
      <button class="btn block" data-act="leftover-sheet">+ Add leftovers / takeout</button>`;
  } else if (S.kseg === 'prepped') {
    const sauces = S.prepped.filter(p => p.type === 'sauce'), ings = S.prepped.filter(p => p.type === 'ingredient');
    body = `<div class="card"><h3>Sauces</h3>${sauces.map(itemRow).join('') || '<div class="empty">No sauces made yet.</div>'}</div>
      <div class="card"><h3>Prepped ingredients</h3>${ings.map(itemRow).join('') || '<div class="empty">Nothing prepped yet.</div>'}</div>
      <button class="btn block" data-act="go" data-tab="cook" data-mode="flavors">Make a sauce or prep-ahead</button>`;
  } else {
    body = ['Fridge', 'Freezer', 'Pantry'].map(loc => {
      const list = S.ing.filter(i => i.storage === loc).sort((a, b) => (a.staple ? 999 : a.days) - (b.staple ? 999 : b.days));
      return list.length ? `<div class="card"><h3>${loc} (${list.length})</h3>${list.map(itemRow).join('')}</div>` : '';
    }).join('') + `<button class="btn block" data-act="add-sheet">+ Add ingredients</button>`;
  }
  return `
  <div class="search">${icon.search}<input id="kitchen-q" type="search" placeholder="Find anything in your kitchen" value="${esc(S.kq)}" aria-label="Search kitchen"></div>
  ${att.length && S.kfilter !== 'soon' && !q ? `<button class="alert" data-act="kfilter" data-v="soon"><span style="flex:1"><b>${att.filter(a => a.days < 0).length ? att.filter(a => a.days < 0).length + ' to check · ' : ''}${att.filter(a => a.days >= 0).length} use soon</b></span><span>Review ›</span></button>` : ''}
  ${q || S.kfilter ? '' : `<div class="seg" role="group" aria-label="Kitchen sections">${segs.map(([k, l, n]) => `<button data-act="kseg" data-seg="${k}" aria-pressed="${S.kseg === k}">${l} <span class="n">${n}</span></button>`).join('')}</div>`}
  <div class="btn-row" style="margin:4px 0">
    <button class="btn" data-act="out-sheet">We're out of…</button>
    <button class="btn" data-act="add-sheet">+ Add</button>
    <button class="icon-btn" data-act="kitchen-menu" aria-label="More kitchen tools">${icon.dots}</button>
  </div>
  ${body}`;
}
function itemRow(x) {
  if (x.kind === 'ready') return readyRow(x);
  const right = x.staple
    ? `<button class="chip ${x.level === 'Full' ? 'ok' : x.level === 'Low' ? 'warn' : 'bad'}" style="border:0;min-height:32px" data-act="level" data-id="${x.id}" aria-label="${esc(x.name)} stock: ${x.level}. Tap to change">${x.level}</button>`
    : daysChip(x.days);
  const isPrep = !!x.unit;
  const qty = isPrep ? `${x.qty} ${x.unit}` : (x.qty || (x.staple ? 'Staple' : ''));
  return `<div class="row">
    <button class="row-main" data-act="item-sheet" data-kind="${isPrep ? 'prepped' : 'ing'}" data-id="${x.id}">
      <div class="row-title">${esc(x.name)}</div><div class="row-meta">${esc(qty)}${isPrep ? ' · ' + esc(x.storage) : ''}</div></button>
    ${right}
    ${x.unit ? `<button class="btn sm" data-act="use-prepped" data-id="${x.id}">Use 1</button>` : ''}
  </div>`;
}

/* ════════════════════════════════════════════════════════════════
   SHOP — with or without a plan
   ════════════════════════════════════════════════════════════════ */
function renderShop() {
  const groups = {};
  S.shop.forEach(s => { const c = CAT[s.name] || 'Other'; (groups[c] = groups[c] || []).push(s); });
  const have = planHave();
  const low = S.ing.filter(i => i.staple && (i.level === 'Low' || i.level === 'Out') && !inShop(i.name));
  const showPicks = S.shop.length < 6 || S.showPicks;
  return `
  <p class="sub" style="margin-top:4px">${S.shop.length ? `<b>${S.shop.length} to buy.</b> Tick items as you shop; they go straight into your kitchen.` : 'Your list is empty.'}</p>
  <form class="btn-row" data-form="add-item" style="flex-wrap:nowrap">
    <input class="field" id="shop-add" placeholder="Add an item…" aria-label="Add an item to the list" style="flex:1;min-width:0">
    <button class="btn primary" type="submit" style="flex:none">Add</button>
  </form>
  ${low.length ? `<button class="alert" data-act="restock"><span style="flex:1">Running low: <b>${esc(low.map(l => l.name).join(', '))}</b></span><span>Add ›</span></button>` : ''}
  ${S.shop.length ? Object.keys(groups).sort().map(c => `<div class="card"><h3>${esc(c)}</h3>${groups[c].map(s => `
    <div class="row">
      <button class="check" data-act="bought" data-id="${s.id}" aria-label="Bought ${esc(s.name)}"></button>
      <button class="row-main" data-act="bought" data-id="${s.id}"><div class="row-title">${esc(s.name)}</div>
        <div class="row-meta">${s.src === 'plan' ? 'For ' + esc(s.for.join(', ')) : s.src === 'low' ? 'Running low' : s.src === 'out' ? 'Ran out' : 'Added by you'}</div></button>
      <button class="heart" data-act="unshop" data-id="${s.id}" aria-label="Remove ${esc(s.name)} from list">${icon.close}</button>
    </div>`).join('')}</div>`).join('') : ''}
  ${have.length ? `<details class="fold"><summary>Already in your kitchen (${have.length})</summary><p class="row-meta" style="margin-top:0">${esc(have.join(', '))}. Not there anymore? Tap one to add it.</p>
    <div class="chips" style="padding-bottom:10px">${have.map(n => `<button class="btn sm" data-act="add-shop" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div></details>` : ''}
  <div class="card">
    <h3>No plan? Quick picks</h3>
    ${showPicks ? `<p class="row-meta" style="margin:0 0 6px">A balanced basket: tap anything to add it.</p>
    ${QUICK_PICKS.map(g => {
      const has = g.items.filter(n => haveLot(n)).length;
      const opts = g.items.filter(n => !haveLot(n) && !inShop(n)).slice(0, 4);
      return `<div class="group-h">${esc(g.role)} <span class="chip ${has ? 'ok' : 'warn'}">${has ? 'have ' + has : 'none at home'}</span></div>
        <div class="chips">${opts.map(n => `<button class="btn sm" data-act="add-shop" data-name="${esc(n)}">+ ${esc(n)}</button>`).join('') || '<span class="row-meta">All covered.</span>'}</div>`;
    }).join('')}` : `<button class="btn block" data-act="show-picks">Show quick picks</button>`}
  </div>
  <div class="btn-row">
    <button class="btn" data-act="bought-other">Bought something else?</button>
    <button class="icon-btn" data-act="shop-menu" aria-label="More list tools">${icon.dots}</button>
  </div>`;
}

/* ════════════════════════════════════════════════════════════════
   Sheets
   ════════════════════════════════════════════════════════════════ */
let lastFocus = null;
function openSheet(title, html) {
  lastFocus = document.activeElement;
  $('sheet').innerHTML = `<div class="grab"></div><div class="sheet-head"><h2 id="sheet-title">${esc(title)}</h2><button class="icon-btn" data-act="close" aria-label="Close">${icon.close}</button></div>${html}`;
  $('sheet').classList.add('open'); $('scrim').classList.add('open');
  const f = $('sheet').querySelector('input, .btn.primary') || $('sheet').querySelector('button');
  setTimeout(() => f && f.focus(), 50);
}
function closeSheet() {
  $('sheet').classList.remove('open'); $('scrim').classList.remove('open');
  if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
}
function recipeSheet(id) {
  const r = recipe(id);
  const miss = missing(r);
  const planned = S.plan.find(b => b.rid === id);
  const sauces = FLAVORS.filter(f => r.ing.some(x => f.goes.some(g => nameMatch(g, x[0])))).slice(0, 2);
  openSheet(r.name, `
    <div class="facts">
      <span class="chip">${r.total} min${r.active !== r.total ? ' · ' + r.active + ' hands-on' : ''}</span>
      <span class="chip">${esc(r.effort)} effort</span><span class="chip">${esc(r.eq)}</span>
      <span class="chip">Serves ${r.serves}</span>${r.batch ? '<span class="chip ok">Keeps well</span>' : ''}
    </div>
    ${miss.length ? `<div class="status-box warn"><b>You need:</b> ${esc(miss.join(', '))}
      <div style="margin-top:6px"><button class="btn sm" data-act="add-missing" data-id="${r.id}">Add ${miss.length === 1 ? 'it' : 'them'} to Shop</button></div></div>`
      : '<div class="status-box ok"><b>You have everything.</b></div>'}
    <details class="fold" open><summary>Ingredients</summary><ul class="ing-list">${r.ing.map(([n, q]) => `<li><span class="${haveLot(n) ? 'have' : 'miss'}" aria-label="${haveLot(n) ? 'have' : 'need'}">${haveLot(n) ? '✓' : '•'}</span><span style="flex:1">${esc(n)}</span><span class="row-meta">${esc(q)}</span></li>`).join('')}</ul></details>
    <details class="fold"><summary>Steps</summary><ol class="steps">${r.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol></details>
    <details class="fold"><summary>Nutrition, cost & storage</summary><p class="row-meta">${r.cal} kcal · ${r.protein} g protein per serving · ≈ ₱${r.cost} total<br>Keeps ${r.fridge} days in the fridge${r.freezer ? ', ' + r.freezer + ' days frozen' : ''}.</p></details>
    ${sauces.length ? `<details class="fold"><summary>Goes well with</summary><div class="chips" style="padding-bottom:10px">${sauces.map(f => `<button class="btn sm" data-act="flavor" data-id="${f.id}">${esc(f.name)}</button>`).join('')}</div></details>` : ''}
    <details class="fold"><summary>Edit or delete recipe</summary><div class="btn-row" style="padding-bottom:10px"><button class="btn" data-act="stub" data-msg="Existing recipe editor, unchanged">Edit</button><button class="btn danger" data-act="stub" data-msg="Delete with confirm, unchanged">Delete</button></div></details>
    <div class="sticky-actions">
      ${planned ? '<button class="btn" disabled>In meal prep ✓</button>' : `<button class="btn" data-act="plan-add" data-id="${r.id}">Add to meal prep</button>`}
      <button class="btn primary" data-act="cooked-sheet" data-id="${r.id}">I cooked this</button>
    </div>`);
}
function cookedSheet(id) {

  openSheet('Nice! ' + r.name, `
    <label class="lbl" for="left">Portions left over (they go to Ready food)</label>
    <div class="stepper"><button data-act="stp" data-t="left" data-d="-1" aria-label="Fewer">−</button><span id="left">${Math.max(0, r.serves - 2)}</span><button data-act="stp" data-t="left" data-d="1" aria-label="More">+</button></div>
    ${uniq.length ? `<label class="lbl">Used up from your kitchen</label>${uniq.map(l => `<label class="row" style="min-height:44px"><input type="checkbox" class="used" value="${l.id}" ${l.type === 'sauce' ? '' : 'checked'} style="width:22px;height:22px"> <span>${esc(l.name)}</span></label>`).join('')}` : ''}

    <div class="facts"><span class="chip">${f.active} min</span><span class="chip">${esc(f.style)}</span>${stock ? `<span class="chip ok">In kitchen: ${stock.qty} ${stock.unit}</span>` : ''}</div>
    <p class="row-meta" style="margin:0 0 6px">Goes with ${esc(f.goes.join(', '))}.</p>
    ${pairs.length ? `<div class="status-box ok">Try it on your ready <b>${esc(pairs.map(p => p.name).join(', '))}</b>.</div>` : ''}

    <div class="sticky-actions">${stock ? `<button class="btn" data-act="use-prepped" data-id="${stock.id}">Use 1</button>` : ''}<button class="btn primary" data-act="made-sheet" data-kind="sauce" data-id="${f.id}">${stock ? 'Made a new batch' : 'I made a batch'}</button></div>`);

function madeSheet(kind, id) {

    <label class="lbl" for="mstore">Where is it?</label>

function outSheet() {

function leftoverSheet() {

    <details class="fold"><summary>Edit details</summary><p class="row-meta">Quantity, unit, printed date, storage and bought date: the existing inline editor, unchanged.</p></details>`);

function readySheet(id) {
  const m = S.ready.find(x => x.id === id);
  if (!m) return;
  openSheet(m.name, `
    <div class="facts"><span class="chip">${m.portions} portions</span><span class="chip">${m.storage}</span>${daysChip(m.days)}</div>
    <button class="menu-row" data-act="eat" data-id="${m.id}" data-close="1"><div>Eat 1 portion</div></button>
    <button class="menu-row" data-act="move" data-id="${m.id}"><div>Move to ${m.storage === 'Fridge' ? 'freezer' : 'fridge'}<small>${m.storage === 'Fridge' ? 'Keeps much longer' : 'Thaw for this week'}</small></div></button>
    <button class="menu-row" data-act="toss" data-kind="ready" data-id="${m.id}"><div>Toss it</div></button>
    <details class="fold"><summary>Edit details</summary><p class="row-meta">Cooked date, protein and portions: the existing editor, unchanged.</p></details>`);
}
function pickerSheet() {
  const list = RECIPES.slice().sort((a, b) => (b.batch - a.batch) || a.name.localeCompare(b.name));
  openSheet('Add to meal prep', `
    <p class="row-meta" style="margin-top:0">Recipes that keep well are first. Tap to add; tap again to remove.</p>
    <div id="pick-list">${list.map(r => { const on = S.plan.some(b => b.rid === r.id); return `<button class="menu-row" data-act="pick" data-id="${r.id}" aria-pressed="${on}"><span class="check" aria-hidden="true">${on ? '✓' : ''}</span><div>${esc(r.name)}<small>${r.total} min · serves ${r.serves}${r.batch ? ' · keeps ' + r.fridge + 'd' : ' · best fresh'}</small></div></button>`; }).join('')}</div>
    <div class="sticky-actions"><button class="btn primary" data-act="close">Done</button></div>`);
}
function prepDaySheet() {
  const tasks = [];
  S.plan.forEach(b => { const r = recipe(b.rid); r.steps.forEach((s, i) => tasks.push({ k: b.id + ':' + i, r: r.name, s })); });
  const done = tasks.filter(t => S.prepDone[t.k]).length;
  openSheet('Prep day', `
    <p class="row-meta" style="margin-top:0">${done} of ${tasks.length} steps done. When a batch is finished it moves to Kitchen as ready food.</p>
    ${S.plan.map(b => { const r = recipe(b.rid); return `<div class="group-h">${esc(r.name)} · ${b.servings} servings</div>
      ${tasks.filter(t => t.k.startsWith(b.id + ':')).map(t => `<label class="row" style="min-height:44px"><input type="checkbox" data-act="prep-step" data-k="${t.k}" ${S.prepDone[t.k] ? 'checked' : ''} style="width:22px;height:22px"><span>${esc(t.s)}</span></label>`).join('')}
      <button class="btn sm block" data-act="batch-done" data-id="${b.id}" style="margin:4px 0 8px">Done: ${b.servings} portions to Kitchen</button>`; }).join('')}`);
}
function settingsSheet() {
  const row = (t, s, msg) => `<button class="menu-row" data-act="stub" data-msg="${esc(msg)}"><div>${t}<small>${s}</small></div><span aria-hidden="true">›</span></button>`;
  openSheet('Settings', `
    <div class="status-box ok" style="display:flex;gap:8px;align-items:center"><span class="dot"></span><span style="flex:1">Saved on this device. <span class="row-meta">Sign in to sync across devices.</span></span></div>
    ${row('Account & sync', 'Sign in, display name, sync status', 'Existing sign-in / account screen, unchanged')}
    ${row('Backup & restore', 'Export, import, restore a backup', 'Existing export / import / restore, unchanged')}
    ${row('Food alerts', 'Notify me when food is about to expire', 'Existing Food expiry alerts toggle, unchanged')}
    ${row('Nutrition', 'Goals and weekly summary', 'Existing Nutrition tab content, moved here')}
    ${row('Price book', 'Store prices for ingredients', 'Existing Price Book, moved here (also from Shop ⋯)')}
    ${row('Cooking tips', 'Batch cooking and storage tips', 'Existing Cooking Hacks, moved here')}
    ${row('Stock health report', 'Dates, stale records, consistency', 'Existing Stock health report, moved here (also Kitchen ⋯)')}
    ${row('Help', 'How the app works', 'Existing Help, unchanged')}
    <button class="menu-row" data-act="reset"><div>Reset prototype data<small>Restores the sample kitchen</small></div></button>`);
}

/* ════════════════════════════════════════════════════════════════
   Render + actions
   ════════════════════════════════════════════════════════════════ */
const TITLES = { home: 'Home', cook: 'Cook', kitchen: 'Kitchen', shop: 'Shop' };
function render() {
  const app = $('app');
  const focusId = document.activeElement && document.activeElement.id;
  const caret = focusId && document.activeElement.selectionStart;
  app.innerHTML = { home: renderHome, cook: renderCook, kitchen: renderKitchen, shop: renderShop }[S.tab]();
  $('page-title').textContent = TITLES[S.tab];
  document.querySelectorAll('.nav button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'));
  const att = attention().length;
  $('kitchen-badge').hidden = !att; $('kitchen-badge').textContent = att;
  $('shop-badge').hidden = !S.shop.length; $('shop-badge').textContent = S.shop.length;
  if (focusId && $(focusId)) { const el = $(focusId); el.focus(); try { el.setSelectionRange(caret, caret); } catch (e) {} }
}
function go(tab, opts = {}) {
  S.tab = tab;
  if (opts.mode) { S.cook = opts.mode; S.cq = ''; }
  if (opts.seg) { S.kseg = opts.seg; S.kfilter = ''; S.kq = ''; }
  if (opts.filter !== undefined) { S.kfilter = opts.filter; S.kq = ''; }
  closeSheet(); render(); window.scrollTo(0, 0);
}
function removeById(arr, id) { const i = arr.findIndex(x => x.id === id); if (i >= 0) arr.splice(i, 1); }
function listFor(kind) { return kind === 'ready' ? S.ready : kind === 'prepped' ? S.prepped : S.ing; }
function addShop(name, src = 'manual') {
  if (!name.trim()) return false;
  if (inShop(name)) { toast(name + ' is already on the list'); return false; }
  S.shop.push({ id: nid('s'), name: name.trim().replace(/^./, c => c.toUpperCase()), src }); return true;
}

const A = {
  go: d => go(d.tab, { mode: d.mode, seg: d.seg, filter: d.filter }),
  mode: d => { S.cook = d.mode; render(); },
  kseg: d => { S.kseg = d.seg; render(); },
  kfilter: d => { S.kfilter = d.v; render(); },
  ffilter: d => { S.flavorFilter = d.v; render(); },
  close: () => closeSheet(),
  settings: () => settingsSheet(),
  stub: d => toast('Prototype: ' + d.msg),
  reset: () => { const t = S.tab; S = freshState(); S.tab = t; syncPlanShop(); closeSheet(); render(); toast('Sample data restored'); },
  recipe: d => recipeSheet(d.id),
  flavor: d => flavorSheet(d.id),
  fav: d => { const i = S.fav.indexOf(d.id); i >= 0 ? S.fav.splice(i, 1) : S.fav.push(d.id); render(); },
  eat: d => {
    const m = S.ready.find(x => x.id === d.id); if (!m) return;
    snapshot(); m.portions--;
    if (m.portions <= 0) removeById(S.ready, m.id);
    if (d.close) closeSheet();
    render(); toast(m.portions > 0 ? `Enjoy! ${m.portions} left` : `Enjoy! That was the last of ${m.name}`, true);
  },
  'ready-sheet': d => readySheet(d.id),
  'item-sheet': d => d.kind === 'ready' ? readySheet(d.id) : itemSheet(d.kind, d.id),
  move: d => { const m = S.ready.find(x => x.id === d.id); snapshot(); m.storage = m.storage === 'Fridge' ? 'Freezer' : 'Fridge'; m.days = m.storage === 'Freezer' ? 60 : 3; closeSheet(); render(); toast('Moved to ' + m.storage.toLowerCase(), true); },
  toss: d => { const x = listFor(d.kind).find(i => i.id === d.id); snapshot(); removeById(listFor(d.kind), d.id); closeSheet(); render(); toast((x ? x.name : 'Item') + ' removed', true); },
  keep: d => { const x = listFor(d.kind).find(i => i.id === d.id); snapshot(); x.days = 3; render(); toast(x.name + ' marked still good', true); },
  'use-prepped': d => { const x = S.prepped.find(p => p.id === d.id); snapshot(); x.qty--; if (x.qty <= 0) removeById(S.prepped, x.id); closeSheet(); render(); toast(x.qty > 0 ? `${x.name}: ${x.qty} ${x.unit} left` : `${x.name} used up`, true); },
  level: d => { const x = S.ing.find(i => i.id === d.id); snapshot(); x.level = { Full: 'Low', Low: 'Out', Out: 'Full' }[x.level]; if (x.level === 'Out' && !inShop(x.name)) addShop(x.name, 'out'); if (d.close) closeSheet(); render(); toast(`${x.name}: ${x.level}${x.level === 'Out' ? ' · added to Shop' : ''}`, true); },
  'cook-with': d => { S.cq = d.name; go('cook'); },
  'out-sheet': () => outSheet(),
  'mark-out': d => {
    const list = listFor(d.kind); const x = list.find(i => i.id === d.id); if (!x) return;
    const alsoShop = $('out-shop') ? $('out-shop').checked : true;
    snapshot();
    if (x.staple) x.level = 'Out'; else removeById(list, x.id);
    const added = alsoShop && addShop(x.name, 'out');
    closeSheet(); render(); toast(`Out of ${x.name}${added ? ' · added to Shop' : ''}`, true);
  },
  'add-sheet': () => addSheet(),
  'bought-other': () => addSheet('bought'),
  'save-add': () => {
    const lines = $('add-lines').value.split('\n').map(s => s.trim()).filter(Boolean);
    if (!lines.length) { $('add-lines').focus(); return; }
    snapshot();
    lines.forEach(l => {
      const m = l.match(/^(.*?)(?:\s+([\d.]+\s*\w*))?$/);
      const name = m[1].replace(/^./, c => c.toUpperCase());
      const staple = S.ing.find(i => i.staple && nameMatch(i.name, name));
      if (staple) staple.level = 'Full';
      else S.ing.push({ id: nid('i'), name, qty: m[2] || '', storage: /rice|oat|noodle|bread|can|bean/i.test(name) ? 'Pantry' : 'Fridge', days: 5 });
      const s = inShop(name); if (s) removeById(S.shop, s.id);
    });
    closeSheet(); render(); toast(`${lines.length} item${lines.length > 1 ? 's' : ''} added to Kitchen`, true);
  },
  'leftover-sheet': () => leftoverSheet(),
  'save-leftover': () => {
    const name = $('lo-name').value.trim(); if (!name) { $('lo-name').focus(); return; }
    snapshot(); S.ready.push({ id: nid('m'), name, portions: +$('lo-p').textContent, storage: $('lo-s').value, days: $('lo-s').value === 'Freezer' ? 60 : 3, protein: '' });
    closeSheet(); render(); toast(name + ' saved to Ready food', true);
  },
  stp: d => { const el = $(d.t); el.textContent = Math.max(0, Math.min(99, +el.textContent + +d.d)); },
  'cooked-sheet': d => cookedSheet(d.id),
  'save-cooked': d => {
    const r = recipe(d.id); const left = +$('left').textContent;
    snapshot();
    document.querySelectorAll('#sheet .used:checked').forEach(cb => { removeById(S.ing, cb.value); removeById(S.prepped, cb.value); });
    if (left > 0) S.ready.push({ id: nid('m'), name: r.name, portions: left, storage: 'Fridge', days: r.fridge, protein: '' });
    closeSheet(); render(); toast(left ? `${left} portions saved to Ready food` : 'Logged. Enjoy!', true);
  },
  'add-missing': d => { snapshot(); let n = 0; missing(recipe(d.id)).forEach(x => { if (addShop(x, 'manual')) n++; }); recipeSheet(d.id); render(); toast(n ? `${n} added to Shop` : 'Already on the list', !!n); },
  'add-shop': d => { snapshot(); if (addShop(d.name)) { render(); toast(d.name + ' added to Shop', true); } },
  'plan-add': d => { snapshot(); S.plan.push({ id: nid('b'), rid: d.id, servings: recipe(d.id).serves }); syncPlanShop(); recipeSheet(d.id); render(); toast(recipe(d.id).name + ' added to meal prep', true); },
  picker: () => pickerSheet(),
  pick: (d, el) => {
    const i = S.plan.findIndex(b => b.rid === d.id);
    if (i >= 0) S.plan.splice(i, 1); else S.plan.push({ id: nid('b'), rid: d.id, servings: recipe(d.id).serves });
    syncPlanShop();
    const on = i < 0; el.setAttribute('aria-pressed', on); el.querySelector('.check').textContent = on ? '✓' : '';
    render();
  },
  serv: d => { const b = S.plan.find(x => x.id === d.id); b.servings = Math.max(1, b.servings + +d.d); render(); },
  unplan: d => { snapshot(); const b = S.plan.find(x => x.id === d.id); removeById(S.plan, d.id); syncPlanShop(); render(); toast(recipe(b.rid).name + ' removed from meal prep', true); },
  prepday: () => prepDaySheet(),
  'prep-step': (d, el) => { S.prepDone[d.k] = el.checked; },
  'batch-done': d => {
    const b = S.plan.find(x => x.id === d.id); const r = recipe(b.rid);
    snapshot();
    S.ready.push({ id: nid('m'), name: r.name, portions: b.servings, storage: 'Fridge', days: r.fridge, protein: '' });
    removeById(S.plan, b.id); syncPlanShop();
    render(); if (S.plan.length) prepDaySheet(); else closeSheet();
    toast(`${r.name}: ${b.servings} portions in Kitchen`, true);
  },
  'made-sheet': d => madeSheet(d.kind, d.id),
  'save-made': d => {
    const qty = +$('mq').textContent; const where = $('mstore').value;
    const src = d.kind === 'sauce' ? flavor(d.id) : PREP_AHEADS.find(p => p.id === d.id);
    snapshot();
    const old = S.prepped.find(p => p.ref === d.id); if (old) removeById(S.prepped, old.id);
    S.prepped.push({ id: nid('x'), type: d.kind, ref: d.id, name: src.name, qty, unit: d.kind === 'sauce' ? 'portions' : src.unit, storage: where, days: where === 'Freezer' ? 60 : d.kind === 'sauce' ? 7 : src.keeps });
    closeSheet(); render(); toast(`${src.name} saved to Kitchen`, true);
  },
  bought: d => {
    const s = S.shop.find(x => x.id === d.id); if (!s) return;
    snapshot(); removeById(S.shop, s.id);
    const staple = S.ing.find(i => i.staple && nameMatch(i.name, s.name));
    if (staple) staple.level = 'Full';
    else S.ing.push({ id: nid('i'), name: s.name, qty: '', storage: CAT[s.name] === 'Pantry' ? 'Pantry' : 'Fridge', days: CAT[s.name] === 'Pantry' ? 180 : 5 });
    render(); toast(`${s.name} → Kitchen`, true);
  },
  unshop: d => { snapshot(); removeById(S.shop, d.id); render(); toast('Removed from list', true); },
  restock: () => { snapshot(); S.ing.filter(i => i.staple && (i.level === 'Low' || i.level === 'Out')).forEach(i => addShop(i.name, 'low')); render(); toast('Low staples added', true); },
  'show-picks': () => { S.showPicks = true; render(); },
  'shop-menu': () => openSheet('List tools', `
    <button class="menu-row" data-act="stub" data-msg="Copy list to clipboard, unchanged"><div>Copy list</div></button>
    <button class="menu-row" data-act="stub" data-msg="Print list, unchanged"><div>Print</div></button>
    <button class="menu-row" data-act="stub" data-msg="Price list for these items + Price Book, unchanged"><div>Prices<small>Estimated cost and the Price Book</small></div></button>
    <button class="menu-row" data-act="clear-shop"><div>Clear the list</div></button>`),
  'clear-shop': () => { snapshot(); S.shop = []; closeSheet(); render(); toast('List cleared', true); },
  'kitchen-menu': () => openSheet('Kitchen tools', `
    <button class="menu-row" data-act="stub" data-msg="Stock health report, unchanged"><div>Stock health report</div></button>
    <button class="menu-row" data-act="stub" data-msg="Inventory checked stamp, unchanged"><div>I checked everything<small>Mark today as a full inventory check</small></div></button>
    <button class="menu-row" data-act="stub" data-msg="Select mode + bulk actions, unchanged"><div>Select several</div></button>
    <button class="menu-row" data-act="stub" data-msg="Ingredient browser, unchanged"><div>Browse ingredients</div></button>`)
};

document.addEventListener('click', e => {
  const nav = e.target.closest('.nav button');
  if (nav) { go(nav.dataset.tab); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') { A[el.dataset.act] && A[el.dataset.act](el.dataset, el); return; }
  e.preventDefault();
  const fn = A[el.dataset.act];
  if (fn) fn(el.dataset, el);
});
document.addEventListener('submit', e => {
  if (e.target.dataset.form === 'add-item') {
    e.preventDefault();
    const v = $('shop-add').value;
    snapshot(); if (addShop(v)) { render(); $('shop-add').value = ''; $('shop-add').focus(); toast(v.trim() + ' added', true); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'cook-q') { S.cq = e.target.value; render(); }
  if (e.target.id === 'kitchen-q') { S.kq = e.target.value; S.kfilter = ''; render(); }
  if (e.target.id === 'out-q') {
    const q = e.target.value.trim().toLowerCase(); let n = 0;
    document.querySelectorAll('#out-list .menu-row').forEach(b => { const on = b.dataset.name.includes(q); b.hidden = !on; if (on) n++; });
    const none = $('out-none'); none.hidden = n > 0 || !q;
    if (!none.hidden) none.innerHTML = `Not in your kitchen. <button class="btn sm" data-act="add-shop" data-name="${esc(e.target.value.trim())}">Add “${esc(e.target.value.trim())}” to Shop</button>`;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('sheet').classList.contains('open')) closeSheet(); });
syncPlanShop();
render();
</script>
</body>
</html>
